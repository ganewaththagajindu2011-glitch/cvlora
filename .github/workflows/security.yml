name: Security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dependencies-and-secrets:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate && pnpm install --frozen-lockfile
      - run: bash scripts/install-gitleaks.sh /tmp/cvlora-tools && /tmp/cvlora-tools/gitleaks git --redact --no-banner
      - run: node scripts/sbom.mjs
      - run: pnpm audit --audit-level high
  codeql:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@cf12ceefebab2c867b9c35d7f907e059681d37ab # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@cf12ceefebab2c867b9c35d7f907e059681d37ab # v3
  containers:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f apps/${{ matrix.app }}/Dockerfile -t cvlora-${{ matrix.app }} .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: cvlora-${{ matrix.app }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
